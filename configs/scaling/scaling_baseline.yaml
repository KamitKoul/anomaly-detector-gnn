# ==============================================================================
# scaling_baseline.yaml — Master Scientific Protocol Configuration
# ==============================================================================
# Research Study: Background-Data Scaling in LHC Olympics PointNet-GAT Anomaly Detection
# Fixed Baseline Specification for Experiment A (Fixed Epochs) & Experiment B (Fixed Updates)
# ==============================================================================

experiment:
  study_name: "background_data_scaling_pointnet_gat"
  research_question: >
    How does background training-data scale affect anomaly discrimination,
    training stability, phase-space generalization, and background-mass sculpting
    in a fixed PointNet-GAT anomaly detector?
  protocol_version: "1.0.0"
  status: "FROZEN"
  date: "2026-10-31"

model:
  architecture_type: "pointnet_gat_hybrid"
  parameter_count: 7957
  input_dim: 3
  hidden_dim: 32
  num_heads: 4
  gat_conv1_out_channels: 16
  gat_conv1_heads: 4
  gat_conv2_out_channels: 32
  gat_conv2_heads: 1
  pointnet_phi_dim: 32
  context_fusion_dim: 96
  decoder_hidden_dims: [32, 16]
  met_head_hidden_dim: 16
  activation: "ELU"

input_representation:
  features: ["pT", "eta", "phi"]
  max_particles: 700
  particle_pt_threshold: 0.0
  log_pt: true
  phi_wrap_around: "[0, pi]"
  include_met_node: true
  phi_met_mode: "atan2"

graph_construction:
  method: "spatial_delta_r"
  delta_r_threshold: 0.4
  exclude_self_loops: true
  use_squared_distance_comparison: true

objectives:
  # Reconstruction Objective (Active)
  recon_loss_weight: 1.0
  pt_loss_weight: 1.0
  ang_loss_weight: 1.0
  periodic_phi_loss: true
  # Auxiliary Objectives (FROZEN TO ZERO to avoid confounding data scaling)
  met_loss_weight: 0.0
  adv_loss_weight: 0.0
  decorrelation_type: "none"
  grl_alpha: 1.0
  mass_norm_gev: 1000.0

optimizer:
  type: "adam"
  learning_rate: 0.001
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-8
  gradient_clipping_norm: 50.0

training_common:
  batch_size: 32
  drop_last: true
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  amp_enabled: true
  amp_device: "cuda"

seeds:
  initial: [42, 123, 999]
  key_comparison: [2026, 7]

dataset_partitions:
  background_h5: "data/events_LHCO2020_backgroundMC_Pythia.h5"
  signal_h5: "data/W_prime_signal.h5"
  split_seed: 20261031
  total_background_events: 1000000
  training_pool_size: 900000
  validation_pool_size: 50000
  final_test_pool_size: 50000
  signal_val_diagnostic_size: 25000
  signal_final_test_size: 25000
  signal_reserve_size: 50000
  tiers:
    D0: 5000
    D1: 25000
    D2: 50000
    D3: 100000
    D4: 250000
    D5: 500000
    D6: 900000

experiment_a:
  name: "fixed_epochs"
  epochs: 20
  description: "Exposes model to more unique events while passes per event remain fixed at 20."
  expected_updates:
    D0: 3120
    D1: 15620
    D2: 31240
    D3: 62500
    D4: 156240
    D5: 312500
    D6: 562500

experiment_b:
  name: "fixed_updates"
  total_optimizer_updates: 10000
  batch_size: 32
  total_event_presentations: 320000
  description: "Holds optimizer update budget constant at 10,000 steps across all dataset tiers."

evaluation:
  held_out_background_events: 50000
  held_out_signal_events: 25000
  score_definitions:
    full: "1/3 * (S_pT + S_eta + S_phi)"
    pt_only: "S_pT"
    ang_only: "1/2 * (S_eta + S_phi)"
    weighted: "0.8 * S_pT + 0.2 * S_ang"
  mass_windows_gev:
    inclusive: [2500.0, 5000.0]
    matched: [3300.0, 3700.0]
    narrow: [3450.0, 3550.0]
  signal_efficiency_points: [0.30, 0.50]
  mass_sculpting_cuts: [0.10, 0.05, 0.01]
  jsd_base: 2.0
  jsd_bins: 40
  jsd_range_gev: [2000.0, 5000.0]
  bootstrap_iterations: 1000
  confidence_interval_level: 0.6827
